"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$python$nodejs$java$haskell$cmd_duration
$character"""

right_format = "$time"

[palettes.catppuccin_mocha]
base    = "#1e1e2e"
mantle = "#181825"
surface0 = "#313244"
overlay0   = "#6c7086"
subtext0  = "#a6adc8"
text    = "#cdd6f4"
red    = "#f38ba8"
yellow    = "#f9e2af"
peach    = "#fab387"
blue    = "#89b4fa"
teal    = "#94e2d5"
mauve    = "#cba6f7"

[username]
show_always = false            # only when SSH'd or root
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)[@](overlay0)"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[$hostname]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold teal)"

[directory]
style = "bold teal"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[python]
symbol = " "
style = "yellow"
format = '[${symbol}${version}( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "blue"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "peach"
format = "[$symbol($version)]($style) "

[haskell]
symbol = " "
style = "mauve"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "overlay0"
format = "[took $duration]($style) "

[time]
disabled = false
style = "overlay0"
format = "[$time]($style)"
time_format = "%H:%M"
