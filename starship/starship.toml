"$schema" = 'https://starship.rs/config-schema.json'
palette = "rose_pine_moon"
add_newline = true

format = """
$directory$git_branch$git_status$python$nodejs$java$haskell$cmd_duration
$character"""

right_format = "$time"

[palettes.rose_pine_moon]
base    = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted   = "#6e6a86"
subtle  = "#908caa"
text    = "#e0def4"
love    = "#eb6f92"
gold    = "#f6c177"
rose    = "#ea9a97"
pine    = "#3e8fb0"
foam    = "#9ccfd8"
iris    = "#c4a7e7"

[character]
success_symbol = "[❯](bold iris)"
error_symbol   = "[❯](bold love)"
vimcmd_symbol  = "[❮](bold foam)"

[directory]
style = "bold foam"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "iris"
format = "[$symbol$branch]($style) "

[git_status]
style = "rose"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[python]
symbol = " "
style = "gold"
format = '[${symbol}${version}( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "pine"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "rose"
format = "[$symbol($version)]($style) "

[haskell]
symbol = " "
style = "iris"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "muted"
format = "[took $duration]($style) "

[time]
disabled = false
style = "muted"
format = "[$time]($style)"
time_format = "%H:%M"
