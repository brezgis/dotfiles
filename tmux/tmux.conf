# Prefix: Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# split with | and -, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# ---- Catppuccin Mocha ----
set -g status-style 'bg=#181825 fg=#cdd6f4'
set -g status-left  '#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#181825]'
set -g status-right '#[fg=#a6adc8] %a %d %b #[fg=#cdd6f4,bold]%H:%M '
set -g status-left-length 30
setw -g window-status-format         '#[fg=#a6adc8]  #I #W  '
setw -g window-status-current-format '#[fg=#f9e2af,bold]  #I #W  '
set -g pane-border-style        'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style            'bg=#313244 fg=#cdd6f4'
set -g mode-style               'bg=#313244 fg=#cdd6f4'
